async function loadDemo(){
  const e=$('de'),b=$('db'),pw=$('dp').value;
  if(pw.length<8){e.textContent='Enter a password of at least 8 characters for the demo accounts.';return}
  if(P.some(x=>x.demo)){e.textContent='Demo data is already loaded.';return}
  b.disabled=true;e.textContent='Working... please wait.';
  try{
    const sec=initializeApp(C,'demo'+Date.now()),a2=getAuth(sec),db2=initializeFirestore(sec,{});
    let made=[];
    for(const [r,ln,fn,mn] of DSTAFF){
      const m='demo.'+r+'@example.com';let uid;
      try{uid=(await createUserWithEmailAndPassword(a2,m,pw)).user.uid}
      catch(x){if(x.code!=='auth/email-already-in-use')throw x;uid=(await signInWithEmailAndPassword(a2,m,pw)).user.uid}
      await setDoc(doc(db,'users',uid),{name:fn+' '+mn+' '+ln,ln,fn,mn,email:m,role:r,active:true,demo:true});
      if(r==='midwife'){
        e.textContent='Adding demo patients...';
        const today=new Date().toLocaleDateString('en-CA');
        await runTransaction(db2,async tx=>{
          const rf=doc(db2,'meta','counters'),c=await tx.get(rf),d=c.exists()?c.data():{};
          let n=d.patients||0,hn=d.households||0;made=[];
          for(const [br,pu,mem] of DHH){
            hn++;const h='HH-'+(1000+hn);
            for(const [fn2,ln2,sx,y,mo] of mem){
              n++;const np={id:'RHU-'+String(n).padStart(6,'0'),fn:fn2,ln:ln2,sex:sx,dob:dobAgo(y,mo),br,pu,tel:'',hh:h,consent:true,consentBy:'Demo data',createdDay:today,demo:true};
              tx.set(doc(db2,'patients',np.id),{...np,createdAt:serverTimestamp()});made.push(np);
            }
          }
          tx.set(rf,{patients:n,households:hn},{merge:true});
        });
      }
    }
    await signOut(a2);
    P.push(...made);
    await lg('Loaded demo data ('+made.length+' patients)');
    msg='';go('users');
  }catch(x){b.disabled=false;e.textContent='Could not load demo data ('+(x.code||x.message)+').'}
}

  const r=RX.find(x=>x.id===id),er=$('dze'),res=[];if(!r)return;

function bExpQ(v){const t=today();return bList(v).filter(b=>b.exp&&b.exp<t).reduce((n,b)=>n+b.qty,0)}

async function imGive(id,k){
  const v=VAX.find(x=>x[0]===k),p=P.find(x=>x.id===id),sk=vxKey(k),vn=(VXS.find(x=>x[0]===sk)||[0,v[1]])[1];
  const d=await sPrompt('Date given','Date '+v[1]+' was given (YYYY-MM-DD)',today(),'Record');if(d===null)return;
  const er=$('ime');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||isNaN(new Date(d))||d>today()||d<p.dob){er.textContent='Enter a valid date (not in the future, not before birth).';return}
  er.textContent='';
  const tracked=!VSE&&VS[sk];
  if(tracked&&bUse(VS[sk])<=0&&!await sConfirm('There is no usable '+vn+' in the vaccine stock. Record the vaccine anyway? The stock will not change.','No stock recorded','Record anyway',0))return;
  const rec={pid:id,pname:pn(p),vax:k,label:v[1],d,by:U.uid,byName:U.name};
  let used=false,ss=null;
  try{
    await runTransaction(db,async tx=>{
      used=false;ss=null;
      const ir=doc(db,'immunizations',id+'_'+k),isn=await tx.get(ir);if(isn.exists())throw{code:'dup'};
      let sr=null,ssn=null;
      if(!VSE){sr=doc(db,'vxstock',sk);ssn=await tx.get(sr)}
      tx.set(ir,{...rec,at:serverTimestamp()});
      if(ssn&&ssn.exists()){
        const cur=ssn.data();
        if(bUse(cur)>=1){
          const np=bPack(bTake(bList(cur),1));
          tx.update(sr,{...np,at:serverTimestamp()});
          tx.set(doc(collection(db,'vxlog')),{key:sk,name:cur.name,type:'out',reason:'Given: '+v[1],note:'',qty:-1,after:np.qty,ref:id+'_'+k,d:today(),by:U.uid,byName:U.name,at:serverTimestamp()});
          ss={...cur,...np};used=true
        }
      }
    });
    IM[id+'_'+k]={d};if(used)VS[sk]=ss;await lg('Immunization '+k+' '+id);
    sDone(used?'The vaccine was recorded. 1 dose of '+vn+' was taken from stock ('+bUse(ss)+' left).':'The vaccine was recorded.','Vaccine recorded');
    imRender();vxRender();if(used)loadVl()
  }catch(x){
    if(x.code==='dup'){er.textContent='This vaccine was already recorded for this child.';loadIm();return}
    if(x.code==='permission-denied'&&!VSE){
      // The stock rules may not be published yet: still record the vaccine, but tell the user the stock was not changed.
      try{await setDoc(doc(db,'immunizations',id+'_'+k),{...rec,at:serverTimestamp()});IM[id+'_'+k]={d};await lg('Immunization '+k+' '+id);imRender();sAlert('The vaccine was recorded, but the vaccine stock was not updated. Publish the latest firestore.rules first.');return}catch(y){}
    }
    er.textContent=x.code==='permission-denied'?'You do not have permission to record vaccines.':'Could not save. Check your connection.'
  }
}

async function vxInSave(k){
  const n=VXS.find(x=>x[0]===k)[1],er=$('vze'),q=Number($('vzq').value),d=$('vzd').value,x=$('vzx').value,lot=$('vzl').value.trim(),src=$('vzs').value,lo=$('vzo').value===''?20:Number($('vzo').value);

function vaChg(reset){
  const v=VS[vad];if(!v||!$('vab'))return;
  const b=bList(v).find(x=>x.id===$('vab').value),r=$('var').value,cnt=r==='Count correction',qe=$('vaq');

async function vxAdjSave(){
  const k=vad,v=VS[k],er=$('vae');if(!v)return;
  const bi=$('vab').value,r=$('var').value,cnt=r==='Count correction',nv=$('vaq').value,n=Number(nv),note=$('van').value.trim();
  if(nv===''||!Number.isInteger(n)||n<0){er.textContent='Enter a whole number, 0 or more.';return}
  if(!cnt&&n<1){er.textContent='Enter how many doses to remove (1 or more).';return}
  if((cnt||r==='Other')&&!note){er.textContent='Add a short note explaining this adjustment.';return}
  er.textContent='';fmBusy(true);let saved=null,chg=0;
  try{
    await runTransaction(db,async tx=>{
      const ref=doc(db,'vxstock',k),sn=await tx.get(ref);if(!sn.exists())throw{code:'gone'};
      const cur=sn.data(),bs=bList(cur),b=bs.find(x=>x.id===bi);if(!b)throw{code:'batch'};
      const nq=cnt?n:b.qty-n;if(nq<0)throw{code:'neg'};
      chg=nq-b.qty;if(!chg)throw{code:'same'};
      const p=bPack(bs.map(x=>x.id===bi?{...x,qty:nq}:x));
      tx.update(ref,{...p,at:serverTimestamp()});
      tx.set(doc(collection(db,'vxlog')),{key:k,name:cur.name,type:'adj',reason:r,note,qty:chg,after:p.qty,batch:bi,d:today(),by:U.uid,byName:U.name,at:serverTimestamp()});
      saved={...cur,...p}
    });
    await lg('Vaccine stock adjust '+v.name+' '+(chg>0?'+':'')+chg+' ('+r+')');
    VS[k]=saved;vad='';fmClose();vxRender();loadVl();imRender();
    sDone((chg<0?'Removed '+(-chg):'Added '+chg)+' doses for '+v.name+'. Now '+bUse(saved)+' usable doses.','Adjustment saved')
  }catch(e){fmBusy(false);er.textContent=e.code==='permission-denied'?'You do not have permission to adjust vaccine stock. Publish the latest firestore.rules first.':e.code==='gone'?'That vaccine is no longer in the list.':e.code==='batch'?'That batch changed. Close this window and try again.':e.code==='neg'?'You cannot remove more than the batch has.':e.code==='same'?'The quantity is the same as now, so nothing was changed.':'Could not save. Check your connection.'}
}

const DPMN=['January','February','March','April','May','June','July','August','September','October','November','December'];
let DPS=null;
const dpIso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dpPar=v=>/^\d{4}-\d{2}-\d{2}$/.test(v||'')?new Date(+v.slice(0,4),+v.slice(5,7)-1,+v.slice(8,10)):null;
function dpClose(){const o=document.getElementById('dpp');if(o)o.remove();DPS=null}
function dpPlace(){
  const o=document.getElementById('dpp');if(!o||!DPS)return;
  if(!document.body.contains(DPS.el)){dpClose();return}
  const r=DPS.el.getBoundingClientRect(),h=o.offsetHeight,w=o.offsetWidth;
  let top=r.bottom+6;const left=Math.min(Math.max(8,r.left),Math.max(8,innerWidth-w-8));
  if(top+h>innerHeight-8&&r.top-h-6>8)top=r.top-h-6;
  o.style.top=Math.max(8,top)+'px';o.style.left=left+'px'
}
function dpDraw(){
  const o=document.getElementById('dpp');if(!o||!DPS)return;
  const {y,m,mn,mx,el}=DPS,ty=new Date().getFullYear(),td=today();
  const y0=mn?+mn.slice(0,4):ty-110,y1=mx?+mx.slice(0,4):(mn?ty+10:ty),yrs=[];
  for(let k=y0;k<=y1;k++)yrs.push(k);
  if(!yrs.includes(y))yrs.push(y);
  yrs.sort((a,b)=>mn?a-b:b-a);
  const sel=dpPar(el.value),selIso=sel?dpIso(sel):'',first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),tOff=(mn&&td<mn)||(mx&&td>mx);
  let g='';for(let i=0;i<first;i++)g+='<span></span>';
  for(let d=1;d<=n;d++){const iso=dpIso(new Date(y,m,d)),off=(mn&&iso<mn)||(mx&&iso>mx);g+=`<button type="button" class="${iso===td?'tdy ':''}${iso===selIso?'sel':''}" data-d="${iso}" ${off?'disabled':''}>${d}</button>`}
  o.innerHTML=`<div class="dpp-h"><button type="button" data-dp="prev" aria-label="Previous month">&#8249;</button><select data-dp="m" aria-label="Month">${DPMN.map((x,i)=>`<option value="${i}" ${i===m?'selected':''}>${x}</option>`).join('')}</select><select data-dp="y" aria-label="Year">${yrs.map(k=>`<option ${k===y?'selected':''}>${k}</option>`).join('')}</select><button type="button" data-dp="next" aria-label="Next month">&#8250;</button></div><div class="dpp-w"><span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span></div><div class="dpp-g">${g}</div><div class="dpp-f"><button type="button" data-dp="today" ${tOff?'disabled':''}>Today</button><button type="button" data-dp="clear">Clear</button></div>`;
  dpPlace()
}
function dpOpen(el){
  if(el.disabled||el.readOnly)return;
  dpClose();

function dpPick(iso){

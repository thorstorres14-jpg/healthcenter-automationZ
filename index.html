<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RHU Health Center System</title>
<style>
:root{color-scheme:light;--bg:#f2f8f7;--cd:#fff;--tx:#1b2a38;--mu:#5b6b7a;--bd:#d5e3e1;--pr:#0b7a7c;--pt:#fff;--ok:#1b6b3a;--ob:#ddf3e4;--wa:#8a5a00;--wb:#fff1d6;--nv:#0b5d5e;--nt:#d5eeec;--na:#14807f;--er:#b42318}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pr)}
input:focus,select:focus,textarea:focus{outline:2px solid #14807f55;border-color:var(--pr)}
.nv:hover{background:rgba(255,255,255,.08)}.mt{background:#e8ecef;color:#5b6b7a}.bt.dn{color:var(--er);border-color:#e3b4ae}
.app{display:flex;min-height:100vh}
.sb{width:230px;background:var(--nv);color:var(--nt);padding:16px 10px;flex:none;display:flex;flex-direction:column;gap:2px}
.sb h1{font-size:15px;color:#fff;margin:0 8px 14px;font-weight:600}
.nv{display:flex;justify-content:space-between;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--nt);border:0;background:none;text-align:left;width:100%}
.nv.on{background:var(--na);color:#fff}.nv.dis{opacity:.45;cursor:default}.nv small{font-size:11px}
.mn{flex:1;min-width:0}
.tb{display:flex;align-items:center;gap:10px;padding:12px 20px;background:var(--cd);border-bottom:1px solid var(--bd);justify-content:space-between}
.ct{padding:20px;max-width:1100px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.gr .cd{margin:0}.st b{display:block;font-size:26px}.st span{color:var(--mu);font-size:13px}
.ov{overflow-x:auto}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd);font-size:14px}th{color:var(--mu);font-weight:500}
tr.cl{cursor:pointer}tr.cl:hover{background:var(--bg)}
.bt{background:var(--pr);color:var(--pt);border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:500}
.bt.g{background:none;color:var(--pr);border:1px solid var(--bd)}.bt:disabled{opacity:.6}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--cd)}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:4px}
.fm{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tg{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px}.ok{background:var(--ob);color:var(--ok)}.wa{background:var(--wb);color:var(--wa)}
.er2{color:var(--er);font-size:13px;margin-top:6px}
.lg{max-width:440px;margin:0 auto;padding:24px 14px}
.hm{display:none}
@media(max-width:800px){.sb{position:fixed;top:0;left:0;bottom:0;width:75%;z-index:5;display:none}.sb.open{display:flex}.hm{display:inline-block}.ct{padding:14px}.tb{padding:10px 14px}}
</style></head><body><div id="root"></div>
<script type="module">
import{firebaseConfig as C}from'./firebase-config.js';
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import{initializeFirestore,persistentLocalCache,persistentMultipleTabManager,doc,getDoc,setDoc,updateDoc,deleteDoc,addDoc,collection,getDocs,query,orderBy,limit,where,runTransaction,writeBatch,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const app=initializeApp(C),auth=getAuth(app);
const db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
const $=i=>document.getElementById(i);
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ROLES=[['developer','Developer'],['admin','Admin'],['doctor','Doctor (MHO)'],['midwife','Midwife / Nurse'],['pharmacist','Pharmacist'],['medtech','Medical technologist'],['bhw','BHW'],['frontdesk','Front desk']];
const RN=Object.fromEntries(ROLES),REG=['midwife','frontdesk','doctor'],LV={doctor:'full',midwife:'full',pharmacist:'rx'},IDLE=600000;
const QROLES=['frontdesk','midwife','doctor','admin','developer'],CROLES=['doctor','midwife'];
const IMR=['doctor','midwife','bhw','admin','developer'];
const NAV=[['dash','Dashboard'],['patients','Patients'],['hh','Households'],['queue','Queue',0,QROLES],['consult','Consultation',0,CROLES],['appr','Rx approvals',0,['doctor']],['imm','Immunization',0,IMR],['pharm','Pharmacy',0,['pharmacist']],['lab','Lab',0,['medtech']],['dev','Developer',0,['developer']],['users','Users',0,['admin','developer']],['audit','Audit log',0,['admin','developer']]];
let Q=[],cp=null,cq=null,hhSel=null,regHH='',qmsg='';
let U=null,S={},P=[],pg='dash',pid=null,q='',msg='',t=Date.now(),mode='boot',setting=false,bk=[];
const today=()=>new Date().toLocaleDateString('en-CA');
const isAdm=()=>U.role==='admin'||U.role==='developer';
const can=k=>U.role==='developer'||(U.role==='admin'&&S[k]===true);
const bhwF=()=>U.role==='bhw'&&S.bhwFront===true;
const canReg=()=>REG.includes(U.role)||can('adminAdd')||bhwF();
const canEdit=()=>REG.includes(U.role)||can('adminEdit')||bhwF();
const VDEF=['frontdesk','midwife','doctor'],VOPT=[['frontdesk','Front desk'],['midwife','Midwife / Nurse'],['doctor','Doctor (MHO)'],['bhw','BHW'],['admin','Admin']];
const qn=n=>'P'+String(n||0).padStart(3,'0');
const rooms=()=>Math.max(1,Math.min(20,parseInt(S.rooms)||1));
let myRoom=null;try{myRoom=parseInt(sessionStorage.getItem('myRoom'))||null}catch(e){}
const curRoom=()=>rooms()===1?1:(myRoom&&myRoom<=rooms()?myRoom:null);
function setMyRoom(v){myRoom=parseInt(v)||null;try{sessionStorage.setItem('myRoom',v)}catch(e){}}
const roomBar=()=>CROLES.includes(U.role)&&rooms()>1?`<div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap"><label style="margin:0"><b>Your room</b></label><select style="width:auto" onchange="setMyRoom(this.value)"><option value="">Choose room...</option>${Array.from({length:rooms()},(_,i)=>`<option value="${i+1}" ${curRoom()===i+1?'selected':''}>Consultation ${i+1}</option>`).join('')}</select></div>`:'';
const syncDisp=(x,extra)=>setDoc(doc(db,'queueDisplay',x.id),{day:x.day,num:x.num,...extra},{merge:true}).catch(()=>{});
async function setRooms(){
  const er=$('rme'),n=parseInt($('rmn').value);er.textContent='';
  if(!(n>=1&&n<=20)){er.textContent='Enter a number from 1 to 20.';return}
  try{await setDoc(doc(db,'meta','settings'),{rooms:n,by:U.name,at:serverTimestamp()},{merge:true});S.rooms=n;await lg('Consultation rooms: '+n);er.textContent='Saved.'}
  catch(x){er.textContent='Could not save. Check your connection.'}
}
const vRoles=()=>Array.isArray(S.vitalsRoles)?S.vitalsRoles:VDEF;
const canVitals=()=>U.role==='developer'||vRoles().includes(U.role)||(bhwF()&&vRoles().includes('frontdesk'));
const lg=a=>U?addDoc(collection(db,'audit'),{uid:U.uid,name:U.name,role:U.real||U.role,action:a,at:serverTimestamp()}).catch(()=>{}):Promise.resolve();
function age(d){const b=new Date(d),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--;if(a<1)return((n.getFullYear()-b.getFullYear())*12+n.getMonth()-b.getMonth())+' mo';return a+' y'}
async function loadP(){const s=await getDocs(query(collection(db,'patients'),orderBy('id')));P=s.docs.map(d=>d.data())}
onAuthStateChanged(auth,async u=>{
  if(setting)return;
  if(!u){U=null;try{mode=(await getDoc(doc(db,'meta','setup'))).exists()?'login':'setup'}catch(e){mode='login'}return R()}
  try{const d=await getDoc(doc(db,'users',u.uid));if(d.exists()&&d.data().active!==false){U={uid:u.uid,...d.data()};try{S=(await getDoc(doc(db,'meta','settings'))).data()||{}}catch(e){S={}}mode='app';pg='dash';msg='';t=Date.now();await loadP().catch(()=>{})}else mode='orphan'}catch(e){mode='orphan'}
  R();
});
function R(){$('root').innerHTML=mode==='boot'?'<div class="lg">Loading...</div>':mode==='app'?shell():mode==='orphan'?orphan():authForm(mode==='setup')}
const orphan=()=>`<div class="lg"><div class="cd"><h3 style="margin-top:0">Account not active</h3><p>Your account has no access yet, or it was deactivated. Ask the administrator for help.</p><button class="bt" onclick="out()">Sign out</button></div></div>`;
const authForm=s=>`<div class="lg"><div class="cd"><h2 style="margin-top:0">RHU Health Center System</h2><p style="color:var(--mu);margin-top:-8px">${s?'First-time setup: create the developer account.':'Sign in with your staff account.'}</p>${msg?`<div class="tg wa" style="display:block;margin-bottom:10px">${E(msg)}</div>`:''}${s?'<label>Last name</label><input id="nl" autocomplete="family-name"><label style="margin-top:10px">First name</label><input id="nf" autocomplete="given-name"><label style="margin-top:10px">Middle name (optional)</label><input id="nmid" autocomplete="additional-name">':''}<label style="margin-top:10px">Email</label><input id="em" type="email" autocomplete="username"><label style="margin-top:10px">Password</label><input id="pw" type="password" autocomplete="current-password"><div class="er2" id="le"></div><button class="bt" style="width:100%;margin-top:12px" onclick="${s?'doSetup()':'doLogin()'}">${s?'Create developer account':'Sign in'}</button></div></div>`;
async function doLogin(){const e=$('le');e.textContent='';try{await signInWithEmailAndPassword(auth,$('em').value.trim(),$('pw').value)}catch(x){e.textContent=x.code==='auth/network-request-failed'?'No internet connection.':'Invalid email or password.'}}
async function doSetup(){
  const e=$('le'),ln=$('nl').value.trim(),fn=$('nf').value.trim(),mn=$('nmid').value.trim(),n=[fn,mn,ln].filter(Boolean).join(' '),m=$('em').value.trim(),p=$('pw').value;
  if(!ln||!fn||!m||p.length<8){e.textContent='Enter your last and first name, an email, and a password of at least 8 characters.';return}
  setting=true;
  try{const c=await createUserWithEmailAndPassword(auth,m,p),b=writeBatch(db);b.set(doc(db,'users',c.user.uid),{name:n,ln,fn,mn,email:m,role:'developer',active:true});b.set(doc(db,'meta','setup'),{at:serverTimestamp()});await b.commit();location.reload()}
  catch(x){setting=false;e.textContent=x.code==='auth/email-already-in-use'?'That email is already registered.':'Setup failed ('+(x.code||x.message)+').'}
}
async function out(){await lg('Signed out');await signOut(auth)}
function go(k,keep){if(!keep)bk=[];pg=k;q='';cp=null;cq=null;if(k!=='reg')regHH='';R();scrollTo(0,0);if(k==='users')loadUsers();if(k==='pharm')loadPh();if(k==='appr')loadAppr();if(k==='lab')loadLab();if(k==='imm')loadIm();if(k==='audit')loadAudit();if(k==='queue'||k==='consult')fetchQ().then(refreshQ)}
const rxApprove=()=>Array.isArray(S.rxApprove)?S.rxApprove:[];
const rxExempt=()=>Array.isArray(S.rxExempt)?S.rxExempt:[];
const needApproval=items=>U.role!=='doctor'&&rxApprove().includes(U.role)&&items.some(i=>!rxExempt().some(x=>x&&i.drug.toLowerCase().includes(x.toLowerCase())));
const rxLine=i=>`${i.drug} ${i.dose}, ${i.freq}${i.dur?', '+i.dur:''}${i.qty?' (#'+i.qty+')':''}`;
let AP=[];
const apg=()=>`<h2 style="margin-top:0">Prescription approvals</h2><p style="color:var(--mu)">Prescriptions written by staff who need a doctor's approval. They go to the pharmacy only after you approve them. You may change the medicines before approving.</p><div id="apl">Loading...</div>`;
async function loadAppr(){
  try{const a=await getDocs(query(collection(db,'prescriptions'),where('status','==','awaiting')));AP=a.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>(x.d||'').localeCompare(y.d||''));apRender()}
  catch(e){const l=$('apl');if(l)l.textContent='Could not load. Check your connection.'}
}
function apRender(){
  const l=$('apl');if(!l)return;
  l.innerHTML=AP.length?AP.map((r,ri)=>`<div class="cd"><b>${E(r.pname)}</b> <span style="color:var(--mu)">${E(r.pid)} | ${E(r.d)} | written by ${E(r.byName||'')}</span>${(r.items||[]).map((it,k)=>`<div class="fm" style="margin-top:8px"><input id="ap${ri}_${k}_d" value="${E(it.drug)}" placeholder="Medicine"><input id="ap${ri}_${k}_o" value="${E(it.dose)}" placeholder="Dose"><input id="ap${ri}_${k}_f" value="${E(it.freq)}" placeholder="Frequency"><input id="ap${ri}_${k}_u" value="${E(it.dur||'')}" placeholder="Duration"><input id="ap${ri}_${k}_q" type="number" min="1" value="${E(it.qty||'')}" placeholder="Qty"></div>`).join('')}<div class="er2" id="ape${ri}"></div><div style="display:flex;gap:8px;margin-top:10px"><button class="bt" onclick="apApprove(${ri})">Approve</button><button class="bt g" onclick="apReject(${ri})">Reject</button></div><div style="color:var(--mu);font-size:13px;margin-top:6px">To remove a medicine, clear its name before approving.</div></div>`).join(''):'<p style="color:var(--mu)">No prescriptions are awaiting approval.</p>'
}
async function apApprove(ri){
  const r=AP[ri],er=$('ape'+ri),g=(k,c)=>$('ap'+ri+'_'+k+'_'+c).value.trim();er.textContent='';
  const items=(r.items||[]).map((_,k)=>({drug:g(k,'d'),dose:g(k,'o'),freq:g(k,'f'),dur:g(k,'u'),qty:g(k,'q')})).filter(i=>i.drug);
  if(!items.length){er.textContent='No medicine is left. Use Reject instead.';return}
  if(items.some(i=>!i.dose||!i.freq)){er.textContent='Each medicine needs a dose and a frequency.';return}
  const rx=items.map(rxLine).join('; ');
  try{const b=writeBatch(db);
    b.update(doc(db,'prescriptions',r.id),{items,rx,status:'pending',approvedBy:U.uid,approvedByName:U.name,approvedAt:serverTimestamp(),edited:rx!==r.rx});
    if(r.vid)b.update(doc(db,'visits',r.vid),{rx});
    await b.commit();await lg('Approved prescription '+r.pid+' '+r.d);await loadAppr()}
  catch(x){er.textContent=x.code==='permission-denied'?'You do not have permission to approve.':'Could not save. Check your connection.'}
}
async function apReject(ri){
  const r=AP[ri],er=$('ape'+ri),why=prompt('Reason for rejecting (optional)','');if(why===null)return;
  try{await updateDoc(doc(db,'prescriptions',r.id),{status:'rejected',rejectedBy:U.uid,rejectedByName:U.name,rejectReason:why.trim(),rejectedAt:serverTimestamp()});await lg('Rejected prescription '+r.pid+' '+r.d);await loadAppr()}
  catch(x){er.textContent='Could not save. Check your connection.'}
}
async function saveRxApprove(){
  const er=$('rae'),n=$('raw').checked?['midwife']:[],ex=$('rax').value.split('\n').map(x=>x.trim()).filter(Boolean);er.textContent='';
  try{await setDoc(doc(db,'meta','settings'),{rxApprove:n,rxExempt:ex,by:U.name,at:serverTimestamp()},{merge:true});S.rxApprove=n;S.rxExempt=ex;await lg('Rx approval: '+(n.length?'required for midwife':'off')+', exempt: '+ex.length);er.textContent='Saved.'}
  catch(x){er.textContent='Could not save. Check your connection.'}
}
const rxApproveCard=()=>`<div class="cd"><h3 style="margin-top:0">Doctor approval for prescriptions</h3><p style="color:var(--mu);margin-top:0">When on, prescriptions saved by a midwife / nurse wait for a doctor to approve them (Rx approvals page) before the pharmacist can see them.</p><label style="display:flex;gap:8px;align-items:center;font-size:14px"><input id="raw" type="checkbox" style="width:auto" ${rxApprove().includes('midwife')?'checked':''}><span>Require doctor approval for prescriptions written by Midwife / Nurse</span></label><label style="margin-top:10px">Medicines that do not need approval (one per line, for example Paracetamol)</label><textarea id="rax" rows="4">${E(rxExempt().join('\n'))}</textarea><div class="er2" id="rae"></div><button class="bt" style="margin-top:10px" onclick="saveRxApprove()">Save</button></div>`;
let VH=[];
const rxRoles=()=>Array.isArray(S.rxRoles)?S.rxRoles:[];
const canRx=()=>U.role==='doctor'||U.role==='developer'||rxRoles().includes(U.role);
async function setRxRole(k,v,el){
  const er=$('rxe'),cur=rxRoles(),n=v?[...new Set([...cur,k])]:cur.filter(x=>x!==k);
  if(er)er.textContent='';
  try{await setDoc(doc(db,'meta','settings'),{rxRoles:n,by:U.name,at:serverTimestamp()},{merge:true});S.rxRoles=n;await lg('Print prescription roles: '+(n.join(', ')||'doctor only'))}
  catch(x){if(el)el.checked=!v;if(er)er.textContent='Could not save. Check your connection.'}
}
const rxRolesCard=()=>`<div class="cd"><h3 style="margin-top:0">Who can print prescriptions</h3><p style="color:var(--mu);margin-top:0">Doctors can always print. The printed prescription is signed by the person who prints it.</p><label style="display:flex;gap:8px;align-items:center;font-size:14px;margin-bottom:6px"><input type="checkbox" style="width:auto" checked disabled><span>Doctor (MHO)</span></label><label style="display:flex;gap:8px;align-items:center;font-size:14px;margin-bottom:6px"><input type="checkbox" style="width:auto" ${rxRoles().includes('midwife')?'checked':''} onchange="setRxRole('midwife',this.checked,this)"><span>Midwife / Nurse</span></label><div class="er2" id="rxe"></div></div>`;
const lh=()=>({name:'RHU Health Center',mun:'',addr:'',contact:'',office:'Office of the Municipal Health Officer',logo:'',...(S.lh||{})});
const lhHtml=sub=>{const h=lh();return `<div class="hd">${h.logo?`<img class="lg" src="${E(h.logo)}">`:''}<div class="ht"><h1>${E(h.name)}</h1>${h.mun?`<div class="s">${E(h.mun)}</div>`:''}${h.addr?`<div class="s">${E(h.addr)}</div>`:''}${h.contact?`<div class="s">${E(h.contact)}</div>`:''}${sub?`<div class="t">${E(sub)}</div>`:''}</div>${h.logo?'<div class="lg"></div>':''}</div>`};
const licTxt=()=>'Lic. No.: '+(U.lic?E(U.lic):'____________');
let lhLogo;
const lhCard=()=>{const h=lh();return `<div class="cd"><h3 style="margin-top:0">Letterhead</h3><p style="color:var(--mu);margin-top:0">Printed at the top of prescriptions and medical certificates.</p><div class="fm"><div><label>Facility name</label><input id="lh1" value="${E(h.name)}"></div><div><label>Municipality / province line</label><input id="lh2" placeholder="Municipality of ____, Province of ____" value="${E(h.mun)}"></div><div><label>Address</label><input id="lh3" value="${E(h.addr)}"></div><div><label>Contact (phone / email)</label><input id="lh4" value="${E(h.contact)}"></div><div><label>Office line on certificates</label><input id="lh5" value="${E(h.office)}"></div></div><label style="margin-top:10px">Logo</label><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><img id="lhimg" src="${E(h.logo)}" style="height:60px;display:${h.logo?'block':'none'}"><input type="file" id="lhf" accept="image/*" onchange="lhPick(this)" style="width:auto"><button class="bt g" onclick="lhNoLogo()">Remove logo</button></div><div class="er2" id="lhe"></div><button class="bt" style="margin-top:10px" onclick="lhSave()">Save letterhead</button></div>`};
function lhPick(el){
  const f=el.files[0],er=$('lhe');if(!f)return;er.textContent='';
  const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
    const k=Math.min(1,256/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    let u=c.toDataURL('image/png');if(u.length>300000)u=c.toDataURL('image/jpeg',.85);
    if(u.length>400000){er.textContent='That image is too large. Use a smaller logo.';return}
    lhLogo=u;$('lhimg').src=u;$('lhimg').style.display='block'};im.onerror=()=>{er.textContent='That file is not a valid image.'};im.src=r.result};r.readAsDataURL(f)
}
function lhNoLogo(){lhLogo='';$('lhimg').style.display='none';$('lhf').value=''}
async function lhSave(){
  const er=$('lhe'),g=i=>$(i).value.trim(),n=g('lh1');er.textContent='';
  if(!n){er.textContent='Enter the facility name.';return}
  const v={name:n,mun:g('lh2'),addr:g('lh3'),contact:g('lh4'),office:g('lh5'),logo:lhLogo===undefined?lh().logo:lhLogo};
  try{await setDoc(doc(db,'meta','settings'),{lh:v,by:U.name,at:serverTimestamp()},{merge:true});S.lh=v;lhLogo=undefined;try{await setDoc(doc(db,'displayConfig','main'),{name:v.name,logo:v.logo||'',at:serverTimestamp()},{merge:true})}catch(e){er.textContent='Saved, but the display could not be updated (admin or developer only).';await lg('Updated letterhead');return}await lg('Updated letterhead');er.textContent='Saved.'}
  catch(x){er.textContent=x.code==='permission-denied'?'Only the developer can change the letterhead.':'Could not save. Check your connection.'}
}
function printDoc(html,size){

async function dispense(id){

  const need={};(r.items||[]).forEach(i=>{const n=Number(i.qty);if(i.drug&&n>0){const k=skey(i.drug);need[k]=(need[k]||0)+n}});
  const low=Object.entries(need).filter(([k,n])=>SK[k]&&SK[k].qty<n).map(([k])=>SK[k].name);

  if((low.length||exp.length)&&!confirm((low.length?'Not enough stock for: '+low.join(', ')+'. ':'')+(exp.length?'Expired stock: '+exp.join(', ')+'. ':'')+'Dispense anyway?'))return;

let LB=[],LD=[];
const lbg=()=>`<h2 style="margin-top:0">Lab</h2><div class="cd ov"><h3 style="margin-top:0">Requests to process</h3><div id="lbl">Loading...</div></div><div class="cd ov"><h3 style="margin-top:0">Done today</h3><div id="lbd"></div></div>`;
function lbRender(){
  const l=$('lbl'),d=$('lbd');if(!l)return;
  l.innerHTML=LB.length?`<table><thead><tr><th>Date</th><th>Patient</th><th>Test</th><th>Result</th><th></th></tr></thead><tbody>${LB.map(r=>`<tr><td>${E(r.d)}</td><td>${E(r.pname)}</td><td>${E(r.test)}</td><td><input id="lr-${r.id}" placeholder="Result" style="min-width:180px"></td><td><button class="bt" onclick="lbSave('${r.id}')">Save result</button></td></tr>`).join('')}</tbody></table><div class="er2" id="lbe"></div>`:'<p style="color:var(--mu)">No requests waiting.</p>';
  d.innerHTML=LD.length?`<table><thead><tr><th>Patient</th><th>Test</th><th>Result</th></tr></thead><tbody>${LD.map(r=>`<tr><td>${E(r.pname)}</td><td>${E(r.test)}</td><td>${E(r.result||'')}</td></tr>`).join('')}</tbody></table>`:'<p style="color:var(--mu)">None yet.</p>'
}
async function loadLab(){
  try{
    const[a,b]=await Promise.all([getDocs(query(collection(db,'labs'),where('status','==','pending'))),getDocs(query(collection(db,'labs'),where('status','==','done'),where('d','==',today())))]);
    LB=a.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>(x.d||'').localeCompare(y.d||''));LD=b.docs.map(d=>d.data());lbRender()
  }catch(e){const l=$('lbl');if(l)l.textContent='Could not load. Check your connection.'}
}
async function lbSave(id){
  const v=$('lr-'+id).value.trim(),er=$('lbe');
  if(!v){er.textContent='Enter the result first.';return}
  try{await updateDoc(doc(db,'labs',id),{status:'done',result:v,resultBy:U.name,resultAt:serverTimestamp()});await lg('Lab result '+id);await loadLab()}
  catch(x){er.textContent=x.code==='permission-denied'?'You do not have permission to enter results.':'Could not save. Check your connection.'}
}
async function loadLabH(id){
  const h=$('labh');if(!h)return;
  try{
    const s=await getDocs(query(collection(db,'labs'),where('pid','==',id))),l=s.docs.map(d=>d.data()).sort((a,b)=>(b.d||'').localeCompare(a.d||''));
    h.innerHTML=l.length?`<table><thead><tr><th>Date</th><th>Test</th><th>Result</th></tr></thead><tbody>${l.map(r=>`<tr><td>${E(r.d)}</td><td>${E(r.test)}</td><td>${r.status==='done'?E(r.result||''):'<span class="tg wa">Pending</span>'}</td></tr>`).join('')}</tbody></table>`:'<p style="color:var(--mu)">No lab requests yet.</p>'
  }catch(e){h.textContent='Could not load lab results.'}
}

/* ---------- Immunization ---------- */
const VAX=[['bcg','BCG',0],['hepb','Hep B (birth)',0],['penta1','Penta 1',42],['opv1','OPV 1',42],['pcv1','PCV 1',42],['penta2','Penta 2',70],['opv2','OPV 2',70],['pcv2','PCV 2',70],['penta3','Penta 3',98],['opv3','OPV 3',98],['pcv3','PCV 3',98],['ipv1','IPV 1',98],['ipv2','IPV 2',274],['mmr1','MMR 1',274],['mmr2','MMR 2',365]];
let IM={},imb='';
const dAge=d=>Math.floor((Date.now()-new Date(d))/864e5);
const imc=()=>`<h2 style="margin-top:0">Immunization</h2><p style="color:var(--mu);margin-top:-6px">Children under 2 with vaccines due, based on the EPI schedule in the app. Confirm the schedule with your RHU before real use.</p><div class="cd"><label>Barangay</label><select id="imb" style="max-width:260px" onchange="imSet(this.value)"><option value="">All barangays</option>${[...new Set(P.map(p=>p.br))].sort().map(b=>`<option ${imb===b?'selected':''}>${E(b)}</option>`).join('')}</select></div><div class="cd ov"><div id="iml">Loading...</div></div>`;
function imSet(v){imb=v;imRender()}
function imRender(){
  const el=$('iml');if(!el)return;
  const can=CROLES.includes(U.role),rows=P.filter(p=>p.dob&&dAge(p.dob)>=0&&dAge(p.dob)<=730&&(!imb||p.br===imb)).map(p=>{const a=dAge(p.dob);return{p,due:VAX.filter(v=>a>=v[2]&&!IM[p.id+'_'+v[0]])}}).filter(r=>r.due.length).sort((x,y)=>y.due.length-x.due.length);
  el.innerHTML=rows.length?`<table><thead><tr><th>Child</th><th>Age</th><th>Purok / Barangay</th><th>Due</th></tr></thead><tbody>${rows.map(({p,due})=>`<tr><td><a href="#" onclick="view('${p.id}');return false">${E(pn(p))}</a></td><td>${age(p.dob)}</td><td>${E(p.pu+', '+p.br)}</td><td>${due.map(v=>can?`<button class="bt g" style="margin:2px" onclick="imGive('${p.id}','${v[0]}')">${v[1]}</button>`:E(v[1])).join(can?'':', ')}</td></tr>`).join('')}</tbody></table><div class="er2" id="ime"></div>`:'<p style="color:var(--mu)">No children with vaccines due.</p>'
}
async function loadIm(){
  try{const s=await getDocs(collection(db,'immunizations'));IM={};s.docs.forEach(d=>{IM[d.id]=d.data()});imRender()}
  catch(e){const l=$('iml');if(l)l.textContent='Could not load. Check your connection.'}
}
async function imGive(id,k){
  const v=VAX.find(x=>x[0]===k),p=P.find(x=>x.id===id),d=prompt('Date '+v[1]+' was given (YYYY-MM-DD)',today());if(d===null)return;
  const er=$('ime');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||isNaN(new Date(d))||d>today()||d<p.dob){er.textContent='Enter a valid date (not in the future, not before birth).';return}
  try{await setDoc(doc(db,'immunizations',id+'_'+k),{pid:id,pname:pn(p),vax:k,label:v[1],d,by:U.uid,byName:U.name,at:serverTimestamp()});IM[id+'_'+k]={d};await lg('Immunization '+k+' '+id);imRender()}
  catch(x){er.textContent=x.code==='permission-denied'?'You do not have permission to record vaccines.':'Could not save. Check your connection.'}
}

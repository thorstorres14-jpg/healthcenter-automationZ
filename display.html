<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Queue Display - Bailen Health Center</title>
<style>
:root{--bg:#eef4f8;--ink:#12324a;--mu:#5b7388;--hd:#0b6e6e;--hd2:#0e8a7d;--card:#fff;--num:#0b6e6e;--line:#d3e0ea;--next:#f59e0b;--flash:#fff3cd}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 32px;background:linear-gradient(90deg,var(--hd),var(--hd2));color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15)}
header .brand{display:flex;align-items:center;gap:18px}
header .brand img{height:clamp(44px,7vw,90px);width:auto;max-width:140px;object-fit:contain}
header .sub{font-size:clamp(13px,1.6vw,20px);opacity:.9;letter-spacing:.12em;text-transform:uppercase}
header h1{margin:0;font-size:clamp(20px,3vw,38px)}
#clock{font-size:clamp(26px,4.4vw,64px);font-weight:600;font-variant-numeric:tabular-nums;text-align:right;line-height:1.15;white-space:nowrap;flex:none;margin-left:24px}
#clock small{display:block;font-size:.55em;font-weight:500;opacity:.95}
main{flex:1;display:grid;grid-template-columns:2fr 1fr;gap:24px;padding:24px 32px;min-height:0}
@media(max-width:800px){main{grid-template-columns:1fr}}
h2{margin:0 0 14px;font-size:clamp(18px,2.4vw,30px);text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}
.now{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;align-content:start}
.card{background:var(--card);border-radius:20px;padding:22px;text-align:center;border:3px solid var(--line);box-shadow:0 4px 14px rgba(18,50,74,.08);container-type:inline-size}
.card .rm{font-size:clamp(18px,2.4vw,30px);color:var(--mu);font-weight:600}
/* The queue number is sized from the width of its own card, so "P001" always stays inside the box. The first font-size is a fallback for old browsers. */
.card .n{font-size:clamp(56px,9vw,190px);font-size:clamp(40px,32cqw,190px);font-weight:800;line-height:1.05;color:var(--num);white-space:nowrap}
.card.flash{animation:fl 1s ease-in-out 6;border-color:var(--next)}
@keyframes fl{50%{background:var(--flash);transform:scale(1.04)}}
.card.latest{border-color:var(--next);box-shadow:0 0 0 6px rgba(245,158,11,.28)}
@media(prefers-reduced-motion:reduce){.card.flash{animation:none;background:var(--flash)}}
.wait{display:flex;flex-wrap:wrap;gap:12px;align-content:flex-start}
.chip{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 20px;font-size:clamp(26px,4vw,56px);font-weight:700;min-width:90px;text-align:center;color:var(--ink)}
.chip{display:flex;flex-direction:column;align-items:center;justify-content:center}
.chip small{font-size:.3em;font-weight:800;letter-spacing:.06em;line-height:1.2}
.chip.next{background:var(--next);border-color:#b45309;color:#2b1a00}
.grp{flex:0 0 100%;margin-top:10px;font-size:clamp(16px,2vw,26px);font-weight:700;color:var(--mu)}
.card.idle{background:transparent;border-style:dashed;box-shadow:none}
.card.idle .n,.card.idle .rm{color:var(--mu);opacity:.7}
.card.idle .n{font-weight:600}
#recent{display:none;align-items:center;flex-wrap:wrap;gap:10px 18px;padding:10px 32px;background:#fff;border-top:2px solid var(--line);font-size:clamp(18px,2.6vw,34px);font-weight:700}
#recent .rl{color:var(--mu);font-weight:600;margin-right:6px}
#recent .rc{background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:2px 14px}
#recent small{font-size:.75em;font-weight:700;color:var(--hd)}
body.idle,body.idle *{cursor:none}
.tip{margin-top:28px;padding:22px 26px;background:#fff;border-left:8px solid var(--hd2);border-radius:12px;font-size:clamp(20px,2.8vw,38px);font-weight:600;line-height:1.3;width:100%}
.empty{color:var(--mu);font-size:clamp(18px,2.2vw,28px)}
#snd{flex-direction:column;gap:20px;position:fixed;inset:0;background:rgba(18,50,74,.88);display:flex;align-items:center;justify-content:center;z-index:9}
#snd p{margin:0;color:#fff;font-size:clamp(16px,2vw,24px);opacity:.9}
#snd button{font-size:28px;padding:22px 40px;border:0;border-radius:16px;background:var(--hd2);color:#fff;cursor:pointer}
#ann{display:none;align-items:center;gap:20px;background:#fff3cd;border-top:4px solid var(--next);padding:14px 32px;font-size:clamp(22px,3.4vw,46px);font-weight:700;color:#5c3d00}
#ann .al{flex:none;font-size:.45em;letter-spacing:.1em;text-transform:uppercase;background:var(--next);color:#fff;padding:8px 16px;border-radius:10px}
#annw{flex:1;min-width:0;overflow:hidden;white-space:nowrap}
#annt{display:inline-block;will-change:transform;animation:mq 20s linear infinite}
@keyframes mq{from{transform:translateX(var(--w,100%))}to{transform:translateX(-100%)}}
#st{display:none;padding:12px 32px;text-align:center;font-weight:700;font-size:clamp(16px,2.4vw,30px);color:#fff}
#st.off{display:block;background:#b91c1c}
#st.con{display:block;background:#92400e}
</style></head><body>
<div id="snd" style="display:none"><button onclick="enableSound()">Tap to turn on sound and start display</button><p>No mouse? Press any key on the keyboard or remote.</p></div>
<header><div class="brand"><img id="lgo" alt="" style="display:none"><div><h1 id="fn">Bailen Health Center</h1><div class="sub">Patient Queue</div></div></div><div id="clock"></div></header>
<div id="st"></div>
<main>
  <section><h2>Now serving</h2><div class="now" id="now"></div></section>
  <section><h2 id="wh">Waiting</h2><div class="wait" id="wait"></div></section>
</main>
<div id="recent"></div>
<div id="ann"></div>
<script type="module">
import{firebaseConfig as C}from'./firebase-config.js';
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import{getFirestore,collection,query,where,onSnapshot,doc}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const db=getFirestore(initializeApp(C));
const qn=n=>'P'+String(n||0).padStart(3,'0');
const W=['zero','one','two','three','four','five','six','seven','eight','nine'];
const spoken=n=>'P '+String(n||0).padStart(3,'0').split('').map(c=>W[+c]).join(' ');
const $=id=>document.getElementById(id);
const day=()=>new Date().toLocaleDateString('en-CA');
const LANG=new URLSearchParams(location.search).get('lang')==='tl'?'tl':'en';
const T={next:'Next',idle:'Available',none:'No patient is being called right now.',recent:'Please proceed',nobody:'No one is waiting.',off:'No connection – information may be out of date.',con:'Connecting…',upd:'Last update'};
let maxRoom=+new URLSearchParams(location.search).get('rooms')||0;
let curDay=day(),unsub=null,soundCfg=null;
const lastDone={};let lastId=null,soundOn=false,first=true,docs=[];const last={},flash={};
let ac=null;
addEventListener('keydown',()=>{if($('snd').style.display==='flex')enableSound()});
window.enableSound=()=>{
  soundOn=true;$('snd').style.display='none';lock();try{if(!document.fullscreenElement)document.documentElement.requestFullscreen()}catch(e){}
  try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}
  try{speechSynthesis.speak(new SpeechSynthesisUtterance(''))}catch(e){}
};
function chime(){
  return new Promise(res=>{
    if(!ac)return res();
    [[880,0],[660,.3]].forEach(([f,t])=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);const s=ac.currentTime+t;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.4,s+.03);g.gain.exponentialRampToValueAtTime(.0001,s+.5);o.start(s);o.stop(s+.55)});
    setTimeout(res,900)})
}
const REPEAT=Math.min(3,Math.max(1,+new URLSearchParams(location.search).get('repeat')||1));
const pause=ms=>new Promise(r=>setTimeout(r,ms));
function tlVoice(){try{return speechSynthesis.getVoices().find(v=>/^(fil|tl)/i.test(v.lang))||null}catch(e){return null}}
function say(text,voice){
  return new Promise(res=>{
    try{const u=new SpeechSynthesisUtterance(text);if(voice){u.voice=voice;u.lang=voice.lang}else u.lang='en-US';u.rate=.9;u.onend=u.onerror=()=>res();speechSynthesis.cancel();speechSynthesis.speak(u);setTimeout(res,12000)}catch(e){res()}})
}
let chain=Promise.resolve();
function announceNext(num,next){
  const v=LANG==='tl'?tlVoice():null,names=next.map(n=>ST[n]||n).join(v?' at ':' and the ');
  const txt=v?`Pasyente ${spoken(num)}, pumunta po sa ${names}.`:`Patient ${spoken(num)}, please proceed to the ${names}.`;
  chain=chain.then(async()=>{if(!soundOn)return;await chime();for(let k=0;k<REPEAT;k++){if(!soundOn)return;if(k)await pause(1500);await say(txt,v)}})
}
function announce(num,room,st){
  const v=LANG==='tl'?tlVoice():null,w=st&&st!=='consult'?(ST[st]||st):null;
  const txt=v?`Pasyente ${spoken(num)}, pumunta po sa ${w||'Consultation '+room}.`:`Patient ${spoken(num)}, please proceed to ${w?'the '+w:'Consultation '+room}.`;
  chain=chain.then(async()=>{if(!soundOn)return;await chime();for(let k=0;k<REPEAT;k++){if(!soundOn)return;if(k)await pause(1500);await say(txt,v)}})
}
function render(){
  const isS=d=>d.station&&d.station!=='consult';
  const now=docs.filter(d=>d.status==='in-consult'&&(d.room||isS(d))).sort((a,b)=>(a.room||99)-(b.room||99)||a.num-b.num);
  const wait=docs.filter(d=>d.status==='waiting'&&!isS(d)).sort((a,b)=>a.num-b.num);
  docs.forEach(d=>{const r=+d.room;if(Number.isInteger(r)&&r>maxRoom&&r<=20)maxRoom=r});
  const card=d=>`<div class="card ${d.id===lastId?'latest':''} ${flash[d.id]>Date.now()?'flash':''}"><div class="rm">${isS(d)?(ST[d.station]||d.station):'Consultation '+d.room}</div><div class="n">${qn(d.num)}</div></div>`;
  const idle=r=>`<div class="card idle"><div class="rm">Consultation ${r}</div><div class="n">&mdash;</div><div class="rm">${T.idle}</div></div>`;
  let h='';
  for(let r=1;r<=maxRoom;r++){const m=now.filter(d=>!isS(d)&&+d.room===r);h+=m.length?m.map(card).join(''):idle(r)}
  h+=now.filter(d=>isS(d)||!(Number.isInteger(+d.room)&&+d.room>=1&&+d.room<=maxRoom)).map(card).join('');
  $('now').innerHTML=h||`<div class="empty">${T.none}</div>`;
  $('wh').textContent='Waiting'+(wait.length?' ('+wait.length+')':'');
  const shown=wait.slice(0,24);
  const grp=['lab','pharmacy','imm'].map(k=>[k,docs.filter(d=>d.status==='waiting'&&d.station===k).sort((a,b)=>a.num-b.num)]).filter(g=>g[1].length);
  let wh=wait.length?shown.map((d,i)=>`<div class="chip ${i===0?'next':''}">${qn(d.num)}${i===0?`<small>${T.next}</small>`:''}</div>`).join('')+(wait.length>shown.length?`<div class="chip">+${wait.length-shown.length}</div>`:''):'';
  wh+=grp.map(([k,l])=>`<div class="grp">${ST[k]} (${l.length})</div>`+l.slice(0,8).map(d=>`<div class="chip">${qn(d.num)}</div>`).join('')+(l.length>8?`<div class="chip">+${l.length-8}</div>`:'')).join('');
  if(!wait.length&&!grp.length)wh=`<div class="empty">${T.nobody}</div><div class="tip" id="tip">${tipNow()}</div>`;
  $('wait').innerHTML=wh;
  const cut=Date.now()-10*60000,tm=d=>d.calledAt&&d.calledAt.toMillis?d.calledAt.toMillis():0;
  // "Please proceed" strip: only patients that a station has just called.
  const rec=docs.filter(d=>d.status==='in-consult'&&isS(d)&&tm(d)>cut).sort((a,b)=>tm(b)-tm(a)).slice(0,6);
  $('recent').style.display=rec.length?'flex':'none';
  $('recent').innerHTML=rec.length?`<span class="rl">${T.recent}</span>`+rec.map(d=>`<span class="rc">${qn(d.num)} <small>→ ${ST[d.station]||d.station}</small></span>`).join(''):''
}
const TIPS=['Wash your hands with soap and water for at least 20 seconds.','Drink enough clean water every day, especially in hot weather.','Cover your mouth and nose when you cough or sneeze.','Keep your child\'s vaccination schedule up to date.','Get 7 to 8 hours of sleep each night.','Take your medicines exactly as prescribed by your doctor.'];
const tipNow=()=>TIPS[Math.floor(Date.now()/12000)%TIPS.length];
const ST={pharmacy:'Pharmacy',lab:'Laboratory',imm:'Immunization'};
const conn={err:false,cache:false,ok:false,t:''};
function setConn(){
  const el=$('st'),bad=conn.err||!navigator.onLine||(conn.cache&&conn.ok);
  if(bad){el.className='off';el.textContent=T.off+(conn.t?' '+T.upd+' '+conn.t:'')}
  else if(!conn.ok){el.className='con';el.textContent=T.con}
  else{el.className='';el.textContent=''}
}
addEventListener('online',setConn);addEventListener('offline',setConn);setConn();
let wl=null;
async function lock(){try{if(wl||document.visibilityState!=='visible')return;wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}catch(e){}}
document.addEventListener('visibilitychange',lock);lock();
let ct;function showCur(){document.body.classList.remove('idle');clearTimeout(ct);ct=setTimeout(()=>document.body.classList.add('idle'),3000)}
addEventListener('mousemove',showCur);showCur();
function sub(){
unsub=onSnapshot(query(collection(db,'queueDisplay'),where('day','==',curDay)),{includeMetadataChanges:true},snap=>{
  conn.err=false;conn.cache=snap.metadata.fromCache;
  if(!snap.metadata.fromCache){conn.ok=true;conn.t=new Date().toLocaleTimeString('en-PH',{hour:'2-digit',minute:'2-digit'})}
  setConn();
  docs=snap.docs.map(d=>({id:d.id,...d.data()}));
  docs.forEach(d=>{
    const ms=d.calledAt&&d.calledAt.toMillis?d.calledAt.toMillis():0;
    if(!first&&d.status==='in-consult'&&(d.room||(d.station&&d.station!=='consult'))&&ms>(last[d.id]||0)){flash[d.id]=Date.now()+7000;lastId=d.id;announce(d.num,d.room,d.station);setTimeout(render,7100)}
    // Sending a patient to a station does not announce anything here. The announcement happens only when the station staff press Call.
    last[d.id]=ms
  });
  first=false;render()
},()=>{conn.err=true;setConn()});
}
sub();
onSnapshot(doc(db,'displayConfig','main'),s=>{const c=s.exists()?s.data():{};if(c.name){$('fn').textContent=c.name;document.title=c.name+' - Queue'}const lg=$('lgo');if(c.logo){lg.src=c.logo;lg.style.display='block'}else lg.style.display='none';soundCfg=s.exists()&&s.data().sound===false?false:true;if(!soundCfg){soundOn=false;$('snd').style.display='none'}else if(!soundOn)$('snd').style.display='flex'},()=>{$('snd').style.display='flex'});

let annData=null,annKey=null;
function fitAnn(){const t=$('annt'),w=$('annw');if(!t||!w)return;const cw=w.clientWidth;t.style.setProperty('--w',cw+'px');t.style.animationDuration=Math.max(10,(cw+t.scrollWidth)/110)+'s'}
function showAnn(){const a=$('ann'),ok=annData&&annData.text&&(!annData.until||annData.until>Date.now());if(ok){a.style.display='flex';if(annKey!==annData.text){annKey=annData.text;a.innerHTML='<div id="annw"><span id="annt"></span></div>';$('annt').textContent=annData.text;fitAnn()}}else{a.style.display='none';annKey=null}}
window.addEventListener('resize',fitAnn);
onSnapshot(doc(db,'announcement','current'),s=>{annData=s.exists()?s.data():null;showAnn()},()=>{});
function tick(){showAnn();{const t=$('tip');if(t&&t.textContent!==tipNow())t.textContent=tipNow()}const n=new Date();if(n.getSeconds()%30===0)render();if(n.getHours()===3&&n.getMinutes()===0&&performance.now()>120000)location.reload();$('clock').innerHTML=n.toLocaleTimeString('en-PH',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+'<small>'+n.toLocaleDateString('en-PH',{weekday:'long',month:'long',day:'numeric',year:'numeric'})+'</small>';if(day()!==curDay){curDay=day();if(unsub)unsub();first=true;docs=[];Object.keys(last).forEach(k=>delete last[k]);Object.keys(lastDone).forEach(k=>delete lastDone[k]);render();sub()}}
tick();setInterval(tick,1000);
</script></body></html>
